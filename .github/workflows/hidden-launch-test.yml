name: hidden-launch-test
# Starts a waiting update script the way the updater does, old way and new way, and counts the
# console windows that become visible while it waits. The script must also finish after the
# process that started it has exited.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [old, new]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extensions/open-cursor/src/update
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the plan module
        run: npx -y esbuild@0.24.0 extensions/open-cursor/src/update/plan.ts --bundle --platform=node --format=cjs --outfile=plan.cjs
      - name: Write a waiting script in a folder with a space and a non English letter
        shell: pwsh
        run: |
          $dir = "C:\t\o $([char]0x00E5)"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $body = "@echo off`r`nchcp 65001 >nul`r`nfor /l %%i in (1,1,8) do (`r`n  tasklist /FI ""IMAGENAME eq nothing.exe"" 2>nul | find /I ""nothing.exe"" >nul`r`n  ping -n 2 127.0.0.1 >nul`r`n)`r`necho done>""%~dp0done.txt""`r`nexit /b 3`r`n"
          [IO.File]::WriteAllText("$dir\install.cmd", $body, (New-Object Text.UTF8Encoding $false))
          "SCRIPT=$dir\install.cmd" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Start it like the updater and count visible console windows
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class Win {
            public delegate bool Cb(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Cb cb, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            public static int Consoles() { int n = 0; EnumWindows((h, l) => { if (IsWindowVisible(h)) { var s = new StringBuilder(256); GetClassName(h, s, 256); if (s.ToString() == "ConsoleWindowClass" || s.ToString() == "PseudoConsoleWindow") n++; } return true; }, IntPtr.Zero); return n; }
          }
          "@
          $base = [Win]::Consoles()
          $js = @'
          const cp = require('child_process'); const p = require('./plan.cjs'); const f = process.env.SCRIPT;
          const l = process.argv[2] === 'new' ? p.hiddenCmdLauncher(f) : { file: 'cmd.exe', args: ['/d', '/c', f] };
          cp.spawn(l.file, [...l.args], { detached: true, stdio: 'ignore', windowsHide: true }).unref();
          '@
          Set-Content launch.js $js
          node launch.js ${{ matrix.mode }}
          "launcher exited"
          $max = 0; $done = Join-Path (Split-Path $env:SCRIPT) 'done.txt'
          for ($i = 0; $i -lt 120 -and -not (Test-Path $done); $i++) { $c = [Win]::Consoles() - $base; if ($c -gt $max) { $max = $c }; Start-Sleep -Milliseconds 200 }
          "mode=${{ matrix.mode }} baseline=$base most visible console windows while waiting=$max finished=$(Test-Path $done)"
          if (-not (Test-Path $done)) { throw "the script did not finish after the launcher exited" }
          if ('${{ matrix.mode }}' -eq 'new' -and $max -gt 0) { throw "$max console windows became visible" }
