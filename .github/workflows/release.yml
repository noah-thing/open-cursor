name: Release build

# Manual only. Builds Open Cursor natively per OS and attaches the installers to the DRAFT
# release. Nothing here ever publishes a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to attach artifacts to
        default: v0.1.0
      only:
        description: 'Targets to build, comma separated, or "all" (macos-arm64, macos-x64, windows-x64, windows-arm64, linux-x64, linux-arm64)'
        default: all
      smoke:
        description: Install the fresh artifacts with install.sh / install.ps1 and run them
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Authenticated GitHub API calls: the build downloads prebuilt binaries (ripgrep, sysroots) from releases.
  GITHUB_TOKEN: ${{ github.token }}
  NODE_OPTIONS: --max-old-space-size=8192
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  FOUNDRY_LOCAL_SKIP_INSTALL: 1
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.p.outputs.mac }}
      win: ${{ steps.p.outputs.win }}
      linux: ${{ steps.p.outputs.linux }}
    steps:
      - id: p
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all='[{"id":"macos-arm64","arch":"arm64","runner":"macos-15"},{"id":"macos-x64","arch":"x64","runner":"macos-15-intel"},{"id":"windows-x64","arch":"x64","runner":"windows-2022"},{"id":"windows-arm64","arch":"arm64","runner":"windows-2022"},{"id":"linux-x64","arch":"x64","runner":"ubuntu-22.04"},{"id":"linux-arm64","arch":"arm64","runner":"ubuntu-22.04"}]'
          pick() {
            echo "$all" | jq -c --arg os "$1" --arg only "$ONLY" \
              '[.[] | select(.id | startswith($os + "-")) | select(.id as $id | $only == "all" or ([$only | split(",")[] | gsub(" "; "")] | index($id)))]'
          }
          echo "mac=$(pick macos)" >> "$GITHUB_OUTPUT"
          echo "win=$(pick windows)" >> "$GITHUB_OUTPUT"
          echo "linux=$(pick linux)" >> "$GITHUB_OUTPUT"

  macos:
    needs: plan
    if: needs.plan.outputs.mac != '[]'
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mac) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: |
          (cd build && npm ci)
          node build/npm/preinstall.ts
          npm ci
      - name: Build extension
        run: cd extensions/open-cursor && npm ci && npm run build
      - name: Package DMG
        run: scripts/open-cursor/package-mac.sh ${{ matrix.arch }}
      - name: Name artifact
        run: |
          VERSION="$(node -p "require('./extensions/open-cursor/package.json').version")"
          mkdir -p dist-out && cp "$(ls ../open-cursor-dist/*-${{ matrix.arch }}.dmg | head -1)" "dist-out/OpenCursor-$VERSION-macos-${{ matrix.arch }}.dmg"
          ls -lh dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist-out/*
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/open-cursor/upload-draft.sh "${{ inputs.tag }}" dist-out/*

  windows:
    needs: plan
    if: needs.plan.outputs.win != '[]'
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.win) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_foreground_scripts: "true"
        run: |
          Push-Location build; npm ci; if ($LASTEXITCODE) { exit 1 }; Pop-Location
          npm ci
          if ($LASTEXITCODE) { exit 1 }
      - name: Build extension
        run: |
          Push-Location extensions/open-cursor
          npm ci; if ($LASTEXITCODE) { exit 1 }
          npm run build; if ($LASTEXITCODE) { exit 1 }
      - name: Build client
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Where-Object Name -Match '^10\.' | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\x64"
          $env:PATH = "$sdk;$env:PATH"
          npm run gulp "vscode-win32-${{ matrix.arch }}-min"
          if ($LASTEXITCODE) { exit 1 }
          npm run gulp "vscode-win32-${{ matrix.arch }}-inno-updater"
          if ($LASTEXITCODE) { exit 1 }
      - name: Build installer and portable zip
        run: |
          npm run gulp "vscode-win32-${{ matrix.arch }}-user-setup"
          if ($LASTEXITCODE) { exit 1 }
          $v = node -p "require('./extensions/open-cursor/package.json').version"
          New-Item -ItemType Directory -Force dist-out | Out-Null
          $setup = Get-ChildItem ".build/win32-${{ matrix.arch }}/user-setup/*.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "dist-out/OpenCursor-$v-windows-${{ matrix.arch }}-setup.exe"
          7z a -tzip -mx=5 "dist-out/OpenCursor-$v-windows-${{ matrix.arch }}-portable.zip" "../VSCode-win32-${{ matrix.arch }}/*"
          Get-ChildItem dist-out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist-out/*
      - name: Attach to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/open-cursor/upload-draft.sh "${{ inputs.tag }}" dist-out/*

  linux:
    needs: plan
    if: needs.plan.outputs.linux != '[]'
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    env:
      VSCODE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk, add swap (the bundler needs more than the 7 GB a standard runner has)
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/julia* /usr/share/swift || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo fallocate -l 20G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h; df -h / /mnt
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev libxkbfile-dev libx11-dev libsecret-1-dev \
            libgbm1 libgtk-3-0 fakeroot dpkg-dev rpm xz-utils
      - name: Build tool dependencies
        run: cd build && npm ci
      - name: Install dependencies (cross toolchain from the upstream sysroot)
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: |
          set -e
          ln -sf "$(command -v python3)" "$RUNNER_TEMP/python" || true
          export PATH="$RUNNER_TEMP:$PATH"
          source ./build/azure-pipelines/linux/setup-env.sh
          node build/npm/preinstall.ts
          npm ci
      - name: Build extension
        run: cd extensions/open-cursor && npm ci && npm run build
      - name: Build client
        run: |
          set -e
          npm run gulp "vscode-linux-${{ matrix.arch }}-min"
          # The bundles are inside VSCode-linux-<arch> now; free the intermediates.
          rm -rf out-build out-vscode-min out-vscode-reh-min out-vscode-reh-web-min .build/extensions .build/electron
          df -h /
      - name: Package tar.gz, deb and rpm
        run: |
          set -e
          V="$(node -p "require('./extensions/open-cursor/package.json').version")"
          A="${{ matrix.arch }}"
          mkdir -p dist-out
          tar -C .. -czf "dist-out/OpenCursor-$V-linux-$A.tar.gz" "VSCode-linux-$A"
          npm run gulp "vscode-linux-$A-prepare-deb"
          npm run gulp "vscode-linux-$A-build-deb"
          cp "$(find .build/linux/deb -name '*.deb' | head -1)" "dist-out/OpenCursor-$V-linux-$A.deb"
          rm -rf .build/linux/deb
          df -h /
          npm run gulp "vscode-linux-$A-prepare-rpm"
          npm run gulp "vscode-linux-$A-build-rpm"
          cp "$(find .build/linux/rpm -name '*.rpm' | head -1)" "dist-out/OpenCursor-$V-linux-$A.rpm"
          rm -rf .build/linux/rpm
          ls -lh dist-out; df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist-out/*
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/open-cursor/upload-draft.sh "${{ inputs.tag }}" dist-out/*

  # ---- Smoke tests: the shipped installers, unchanged, against the artifacts just built. ----
  # curl (install.sh) and Invoke-RestMethod/Invoke-WebRequest (install.ps1) are replaced by stand-ins
  # that answer the GitHub API call from a mock release and serve downloads from the artifact folder.
  smoke-linux:
    needs: [linux]
    if: ${{ !cancelled() && inputs.smoke && needs.linux.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: assets
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-arm64
          path: assets-arm64
      - name: Package metadata (name, desktop entry, icon)
        run: |
          set -e
          sudo apt-get install -y rpm >/dev/null
          for d in assets assets-arm64; do
            [ -d "$d" ] || continue
            echo "== $d"
            ls -l "$d"
            deb=$(ls $d/*.deb); rpm=$(ls $d/*.rpm)
            dpkg-deb -I "$deb" | grep -E "Package:|Architecture:|Maintainer:|Description:"
            dpkg-deb -I "$deb" | grep -q "Package: open-cursor"
            dpkg-deb -c "$deb" | grep -E "applications/.*desktop|pixmaps" 
            dpkg-deb -x "$deb" "$d/deb-root"
            grep -H -E "^(Name|Icon|Exec)=" "$d"/deb-root/usr/share/applications/*.desktop
            grep -q "^Name=OpenCursor$" "$d/deb-root/usr/share/applications/open-cursor.desktop"
            grep -q "^Icon=open-cursor$" "$d/deb-root/usr/share/applications/open-cursor.desktop"
            test -s "$d/deb-root/usr/share/pixmaps/open-cursor.png"
            ! grep -rqi "packages.microsoft.com" "$d/deb-root" 2>/dev/null || true
            rpm -qip "$rpm" | grep -E "Name|Architecture|Vendor|Summary"
            rpm -qlp "$rpm" | grep -E "desktop|pixmaps"
            echo "icon sha: $(sha256sum "$d/deb-root/usr/share/pixmaps/open-cursor.png" | cut -c1-16) repo: $(sha256sum resources/linux/code.png 2>/dev/null | cut -c1-16)"
          done
      - name: Install with install.sh (apt path)
        run: |
          set -e
          export MOCK_ASSET_DIR="$PWD/assets" MOCK_RELEASE_JSON="$PWD/release.json"
          sh scripts/open-cursor/mock-release.sh assets > release.json
          mkdir -p "$RUNNER_TEMP/mockbin" && cp scripts/open-cursor/smoke-curl.sh "$RUNNER_TEMP/mockbin/curl"
          PATH="$RUNNER_TEMP/mockbin:$PATH" sh install.sh
          command -v open-cursor
          open-cursor --version | tee version.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' version.txt
          dpkg -s open-cursor | grep -E "Status|Version"
          ! ls /etc/apt/sources.list.d | grep -i vscode
          sudo apt-get remove -y open-cursor
      - name: Install with install.sh (tar.gz fallback)
        run: |
          set -e
          export MOCK_ASSET_DIR="$PWD/assets" MOCK_RELEASE_JSON="$PWD/release-tar.json"
          sh scripts/open-cursor/mock-release.sh assets '\.(deb|rpm)$' > release-tar.json
          PATH="$RUNNER_TEMP/mockbin:$PATH" sh install.sh
          test -x "$HOME/.local/bin/open-cursor"
          "$HOME/.local/bin/open-cursor" --version | tee version2.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' version2.txt

  smoke-windows:
    needs: [windows]
    if: ${{ !cancelled() && inputs.smoke && needs.windows.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: assets
      - name: Install with install.ps1
        run: |
          $assets = (Resolve-Path assets).Path
          Get-ChildItem $assets | Format-Table Name, Length
          # Stand-ins win over the cmdlets of the same name for the unchanged script.
          function Invoke-RestMethod {
            param($Uri, $Headers)
            [pscustomobject]@{
              tag_name = 'v0.1.0'
              assets = @(Get-ChildItem $assets | ForEach-Object { [pscustomobject]@{ name = $_.Name; browser_download_url = $_.FullName } })
            }
          }
          function Invoke-WebRequest {
            param($Uri, $OutFile, [switch]$UseBasicParsing)
            Copy-Item $Uri $OutFile
          }
          . "$PWD/install.ps1"
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenCursor'
          Get-ChildItem $dir | Select-Object -First 30 | Format-Table Name
          if (-not (Test-Path "$dir\OpenCursor.exe")) { throw 'OpenCursor.exe was not installed' }
          $v = & "$dir\bin\open-cursor.cmd" --version
          $v
          if (($v | Select-Object -First 1) -notmatch '^\d+\.\d+\.\d+') { throw 'open-cursor --version printed no version' }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*.lnk' | Where-Object { $_.FullName -match 'OpenCursor' }
          $lnk | ForEach-Object FullName
          if (-not $lnk) { throw 'no Start menu shortcut named OpenCursor' }
          $reg = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like '*OpenCursor*' }
          $reg | Select-Object DisplayName, DisplayVersion, Publisher | Format-List
          if (-not $reg) { throw 'not registered for uninstall' }

  smoke-macos:
    needs: [macos]
    if: ${{ !cancelled() && inputs.smoke && needs.macos.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: macos-arm64, runner: macos-15 }
          - { id: macos-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: ${{ matrix.id }}
          path: assets
      - name: Install with install.sh
        if: steps.dl.outcome == 'success'
        run: |
          set -e
          export MOCK_ASSET_DIR="$PWD/assets" MOCK_RELEASE_JSON="$PWD/release.json"
          sh scripts/open-cursor/mock-release.sh assets > release.json
          mkdir -p "$RUNNER_TEMP/mockbin" && cp scripts/open-cursor/smoke-curl.sh "$RUNNER_TEMP/mockbin/curl"
          export OPENCURSOR_DIR="$RUNNER_TEMP/Apps"
          PATH="$RUNNER_TEMP/mockbin:$PATH" sh install.sh
          APP="$OPENCURSOR_DIR/OpenCursor.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleIdentifier" -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/OpenCursor"
          ls "$APP/Contents/Resources/app/bin"
          CLI=$(find "$APP/Contents/Resources/app/bin" -maxdepth 1 -type f | head -1)
          "$CLI" --version | tee version.txt
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' version.txt
