name: updater-test
# Runs the app's real update scripts on every system: an installed older release is updated to a newer one.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Release to update from
        default: v0.1.3
      to:
        description: Release to update to
        default: v0.1.4
permissions:
  contents: read
jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the update plan
        run: npx -y esbuild@0.24.0 extensions/open-cursor/src/update/plan.ts --bundle --platform=node --format=cjs --outfile=plan.cjs
      - name: Download both portable zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.from }} -R ${{ github.repository }} -p "*-windows-x64-portable.zip" -O from.zip
          gh release download ${{ inputs.to }} -R ${{ github.repository }} -p "*-windows-x64-portable.zip" -O to.zip
      - name: Lay out an old portable copy in a folder with other files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\t\OC | Out-Null
          tar -xf from.zip -C C:\t\OC
          New-Item -ItemType Directory -Force C:\t\OC\data\user-data | Out-Null
          Set-Content C:\t\OC\data\user-data\marker.txt "keep me"
          Set-Content C:\t\OC\my-own-file.txt "keep me too"
          Set-Content C:\t\OC\resources\app\stale-from-old-version.txt "should go"
      - name: Unpack the new version the way the app does
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\t\OC.new-update | Out-Null
          tar -xf to.zip -C C:\t\OC.new-update
          if (!(Test-Path C:\t\OC.new-update\OpenCursor.exe)) { throw "no exe in staged" }
      - name: Write the update script with the app's own code
        run: node -e "const p=require('./plan.cjs');require('fs').writeFileSync('C:/t/install.cmd',p.portableScript({staged:'C:\\t\\OC.new-update',root:'C:\\t\\OC',exe:'C:\\t\\OC\\OpenCursor.exe',relaunchFlag:'C:\\t\\relaunch',log:'C:\\t\\update.log'}))"
      - name: Run it while a process named OpenCursor.exe is still open
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\t\fake | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" C:\t\fake\OpenCursor.exe
          $fake = Start-Process C:\t\fake\OpenCursor.exe -ArgumentList "-n","9","127.0.0.1" -PassThru -WindowStyle Hidden
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmd.exe /d /c C:\t\install.cmd
          $code = $LASTEXITCODE
          $sw.Stop()
          "exit $code after $([int]$sw.Elapsed.TotalSeconds) s"
          Get-Content C:\t\update.log -Tail 5
          if ($code -ne 0) { throw "update script failed" }
          if ($sw.Elapsed.TotalSeconds -lt 5) { throw "did not wait for OpenCursor.exe to quit" }
      - name: Check the result
        shell: pwsh
        run: |
          $want = "${{ inputs.to }}".TrimStart("v")
          $pkg = Get-Content C:\t\OC\resources\app\extensions\open-cursor\package.json -Raw | ConvertFrom-Json
          "installed version: $($pkg.version)"
          if ($pkg.version -ne $want) { throw "expected $want" }
          if (!(Test-Path C:\t\OC\data\user-data\marker.txt)) { throw "data folder was touched" }
          if (!(Test-Path C:\t\OC\my-own-file.txt)) { throw "a file outside the app was deleted" }
          if (Test-Path C:\t\OC\resources\app\stale-from-old-version.txt) { throw "stale app file not removed" }
          if (Test-Path C:\t\OC.new-update) { throw "staging folder left behind" }
          "all checks passed"
      - name: The updated copy starts
        shell: pwsh
        run: |
          $out = & C:\t\OC\bin\open-cursor.cmd --version 2>&1
          $out
          if ($LASTEXITCODE -ne 0) { throw "updated app does not start" }

  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the update plan
        run: npx -y esbuild@0.24.0 extensions/open-cursor/src/update/plan.ts --bundle --platform=node --format=cjs --outfile=plan.cjs
      - name: Download both setups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.from }} -R ${{ github.repository }} -p "*-windows-x64-setup.exe" -O C:\from-setup.exe
          gh release download ${{ inputs.to }} -R ${{ github.repository }} -p "*-windows-x64-setup.exe" -O C:\to-setup.exe
      - name: Install the old version
        shell: pwsh
        run: |
          Start-Process C:\from-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!runcode' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenCursor'
          if (!(Test-Path "$dir\OpenCursor.exe")) { throw "old version not installed" }
          & "$dir\bin\open-cursor.cmd" --version
      - name: Write and run the app's update script
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenCursor'
          New-Item -ItemType Directory -Force C:\t | Out-Null
          $env:OC_SETUP = 'C:\to-setup.exe'; $env:OC_EXE = "$dir\OpenCursor.exe"
          node -e "const p=require('./plan.cjs');require('fs').writeFileSync('C:/t/install.cmd',p.windowsScript({setup:process.env.OC_SETUP,exe:process.env.OC_EXE,relaunchFlag:'C:\\t\\relaunch',log:'C:\\t\\update.log'}))"
          Get-Content C:\t\install.cmd
          cmd.exe /d /c C:\t\install.cmd
          "exit $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "update script failed" }
      - name: Check the result
        shell: pwsh
        run: |
          $want = "${{ inputs.to }}".TrimStart("v")
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenCursor'
          $pkg = Get-ChildItem $dir -Recurse -Filter package.json | Where-Object { $_.FullName -match 'extensions\\open-cursor\\package\.json$' } | Select-Object -First 1
          $v = (Get-Content $pkg.FullName -Raw | ConvertFrom-Json).version
          "installed version: $v"
          if ($v -ne $want) { throw "expected $want" }
          & "$dir\bin\open-cursor.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "updated app does not start" }
          "all checks passed"


  # The same updates, started exactly as the app starts them: detached through PowerShell. Fails if the
  # script dies with its launcher, does not wait, does not install, or shows a single console window.
  windows-portable-hidden:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the update plan
        run: npx -y esbuild@0.24.0 extensions/open-cursor/src/update/plan.ts --bundle --platform=node --format=cjs --outfile=plan.cjs
      - name: Download both portable zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.from }} -R ${{ github.repository }} -p "*-windows-x64-portable.zip" -O from.zip
          gh release download ${{ inputs.to }} -R ${{ github.repository }} -p "*-windows-x64-portable.zip" -O to.zip
      - name: Lay out an old portable copy in a folder with a space and a non English letter
        shell: pwsh
        run: |
          $root = "C:\t\Ö C\OC"
          New-Item -ItemType Directory -Force $root | Out-Null
          tar -xf from.zip -C $root
          New-Item -ItemType Directory -Force "$root\data\user-data" | Out-Null
          Set-Content "$root\data\user-data\marker.txt" "keep me"
          Set-Content "$root\my-own-file.txt" "keep me too"
          New-Item -ItemType Directory -Force "$root.new-update" | Out-Null
          tar -xf to.zip -C "$root.new-update"
      - name: Start it like the app and watch the screen
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class Win {
            public delegate bool Cb(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Cb cb, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            public static int Consoles() { int n = 0; EnumWindows((h, l) => { if (IsWindowVisible(h)) { var s = new StringBuilder(256); GetClassName(h, s, 256); if (s.ToString() == "ConsoleWindowClass" || s.ToString() == "PseudoConsoleWindow") n++; } return true; }, IntPtr.Zero); return n; }
          }
          "@
          $root = "C:\t\Ö C\OC"
          New-Item -ItemType Directory -Force C:\t\fake | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" C:\t\fake\OpenCursor.exe
          $fake = Start-Process C:\t\fake\OpenCursor.exe -ArgumentList "-n","12","127.0.0.1" -PassThru -WindowStyle Hidden
          $base = [Win]::Consoles()
          $js = @'
          const cp = require('child_process'), fs = require('fs'), p = require('./plan.cjs');
          const root = process.argv[2], ps1 = 'C:\\t\\install.ps1';
          const o = { staged: root + '.new-update', root, exe: root + '\\OpenCursor.exe', relaunchFlag: 'C:\\t\\relaunch', log: 'C:\\t\\update.log' };
          fs.writeFileSync(ps1, '\ufeff' + p.portablePsScript(o), 'utf8');
          const l = p.windowsLauncher(ps1);
          const c = cp.spawn(l.file, [...l.args], { detached: true, stdio: 'ignore', windowsHide: true });
          c.on('error', e => { console.log('spawn error ' + e.message); process.exit(1); });
          console.log(c.pid); c.unref(); setTimeout(() => process.exit(0), 1500);
          '@
          Set-Content launch.cjs $js
          $launched = node launch.cjs $root
          "launcher pid $launched; launcher process has exited"
          $max = 0; $sw = [Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt 300) {
            $c = [Win]::Consoles() - $base; if ($c -gt $max) { $max = $c }
            if ((Test-Path C:\t\update.log) -and (Select-String -Path C:\t\update.log -Pattern 'update: (done|failed)' -Quiet)) { break }
            Start-Sleep -Milliseconds 200
          }
          "finished after $([int]$sw.Elapsed.TotalSeconds) s, most visible console windows: $max, fake app still running: $(!$fake.HasExited)"
          Get-Content C:\t\update.log -Tail 5
          if (!(Select-String -Path C:\t\update.log -Pattern 'update: done' -Quiet)) { throw "the update did not finish" }
          if ($sw.Elapsed.TotalSeconds -lt 8) { throw "did not wait for OpenCursor.exe to quit" }
          if ($max -gt 0) { throw "$max console windows became visible" }
      - name: Check the result
        shell: pwsh
        run: |
          $root = "C:\t\Ö C\OC"
          $want = "${{ inputs.to }}".TrimStart("v")
          $pkg = Get-Content "$root\resources\app\extensions\open-cursor\package.json" -Raw | ConvertFrom-Json
          "installed version: $($pkg.version)"
          if ($pkg.version -ne $want) { throw "expected $want" }
          if (!(Test-Path "$root\data\user-data\marker.txt")) { throw "data folder was touched" }
          if (!(Test-Path "$root\my-own-file.txt")) { throw "a file outside the app was deleted" }
          if (Test-Path "$root.new-update") { throw "staging folder left behind" }
          if (Test-Path "$root.update-lock") { throw "lock left behind" }
          "all checks passed"

  windows-setup-hidden:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the update plan
        run: npx -y esbuild@0.24.0 extensions/open-cursor/src/update/plan.ts --bundle --platform=node --format=cjs --outfile=plan.cjs
      - name: Download both setups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.from }} -R ${{ github.repository }} -p "*-windows-x64-setup.exe" -O C:\from-setup.exe
          gh release download ${{ inputs.to }} -R ${{ github.repository }} -p "*-windows-x64-setup.exe" -O C:\to-setup.exe
      - name: Install the old version
        shell: pwsh
        run: |
          Start-Process C:\from-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!runcode' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenCursor'
          if (!(Test-Path "$dir\OpenCursor.exe")) { throw "old version not installed" }
      - name: Start it like the app and watch the screen
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class Win {
            public delegate bool Cb(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Cb cb, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            public static int Consoles() { int n = 0; EnumWindows((h, l) => { if (IsWindowVisible(h)) { var s = new StringBuilder(256); GetClassName(h, s, 256); if (s.ToString() == "ConsoleWindowClass" || s.ToString() == "PseudoConsoleWindow") n++; } return true; }, IntPtr.Zero); return n; }
          }
          "@
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenCursor'
          New-Item -ItemType Directory -Force C:\t\fake | Out-Null
          Copy-Item "$env:SystemRoot\System32\PING.EXE" C:\t\fake\OpenCursor.exe
          $fake = Start-Process C:\t\fake\OpenCursor.exe -ArgumentList "-n","12","127.0.0.1" -PassThru -WindowStyle Hidden
          New-Item -ItemType File -Force C:\t\relaunch-not-wanted | Out-Null
          $base = [Win]::Consoles()
          $js = @'
          const cp = require('child_process'), fs = require('fs'), p = require('./plan.cjs');
          const ps1 = 'C:\\t\\install.ps1';
          fs.writeFileSync(ps1, '\ufeff' + p.windowsPsScript({ setup: 'C:\\to-setup.exe', exe: process.argv[2] + '\\OpenCursor.exe', relaunchFlag: 'C:\\t\\relaunch', log: 'C:\\t\\update.log' }), 'utf8');
          const l = p.windowsLauncher(ps1);
          const c = cp.spawn(l.file, [...l.args], { detached: true, stdio: 'ignore', windowsHide: true });
          c.on('error', e => { console.log('spawn error ' + e.message); process.exit(1); });
          console.log(c.pid); c.unref(); setTimeout(() => process.exit(0), 1500);
          '@
          Set-Content launch.cjs $js
          $pid2 = [int](node launch.cjs $dir)
          "script pid $pid2; launcher process has exited"
          $max = 0; $sw = [Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt 600 -and (Get-Process -Id $pid2 -ErrorAction SilentlyContinue)) {
            $c = [Win]::Consoles() - $base; if ($c -gt $max) { $max = $c }
            Start-Sleep -Milliseconds 200
          }
          "script ended after $([int]$sw.Elapsed.TotalSeconds) s, most visible console windows: $max"
          if (Get-Process -Id $pid2 -ErrorAction SilentlyContinue) { throw "the update script never finished" }
          if ($sw.Elapsed.TotalSeconds -lt 8) { throw "did not wait for OpenCursor.exe to quit" }
          if ($max -gt 0) { throw "$max console windows became visible" }
      - name: Check the result
        shell: pwsh
        run: |
          $want = "${{ inputs.to }}".TrimStart("v")
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenCursor'
          $pkg = Get-ChildItem $dir -Recurse -Filter package.json | Where-Object { $_.FullName -match 'extensions\\open-cursor\\package\.json$' } | Select-Object -First 1
          $v = (Get-Content $pkg.FullName -Raw | ConvertFrom-Json).version
          "installed version: $v"
          if ($v -ne $want) { throw "expected $want" }
          "all checks passed"

  linux-tar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the update plan
        run: npx -y esbuild@0.24.0 extensions/open-cursor/src/update/plan.ts --bundle --platform=node --format=cjs --outfile=plan.cjs
      - name: Download both tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.from }} -R ${{ github.repository }} -p "*-linux-x64.tar.gz" -O from.tgz
          gh release download ${{ inputs.to }} -R ${{ github.repository }} -p "*-linux-x64.tar.gz" -O to.tgz
      - name: Install the old version and stage the new one like the app does
        run: |
          mkdir -p "/tmp/t/Open Cursor" "/tmp/t/work"
          tar -xzf from.tgz -C "/tmp/t/Open Cursor" --strip-components=1
          STAGED="/tmp/t/Open Cursor.new-update-1-$(date +%s)000"
          mkdir -p "$STAGED" && tar -xzf to.tgz -C "$STAGED" --strip-components=1
          echo "STAGED=$STAGED" >> "$GITHUB_ENV"
          cp to.tgz /tmp/t/work/to.tgz
      - name: Run the app's swap script
        run: |
          node -e "const p=require('./plan.cjs');require('fs').writeFileSync('/tmp/t/work/install.sh',p.swapScript({platform:'linux',staged:process.env.STAGED,target:'/tmp/t/Open Cursor',relaunchFlag:'/tmp/t/work/relaunch',log:'/tmp/t/update.log',download:'/tmp/t/work/to.tgz',work:'/tmp/t/work'}))"
          sh /tmp/t/work/install.sh; echo "exit $?"
          cat /tmp/t/update.log || true
      - name: Check the result
        run: |
          want="${{ inputs.to }}"; want="${want#v}"
          got=$(node -p "require('/tmp/t/Open Cursor/resources/app/extensions/open-cursor/package.json').version")
          echo "installed version: $got"
          test "$got" = "$want"
          test ! -e "$STAGED" || { echo "staging left behind"; exit 1; }
          test ! -e "/tmp/t/Open Cursor.old-update" || { echo "old copy left behind"; exit 1; }
          "/tmp/t/Open Cursor/bin/open-cursor" --version --no-sandbox || "/tmp/t/Open Cursor/bin/open-cursor" --version
          echo "all checks passed"

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle the update plan
        run: npx -y esbuild@0.24.0 extensions/open-cursor/src/update/plan.ts --bundle --platform=node --format=cjs --outfile=plan.cjs
      - name: Download both disk images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.from }} -R ${{ github.repository }} -p "*-macos-arm64.dmg" -O from.dmg
          gh release download ${{ inputs.to }} -R ${{ github.repository }} -p "*-macos-arm64.dmg" -O to.dmg
      - name: Install the old version and stage the new one like the app does
        run: |
          mkdir -p "/tmp/t/Apps" "/tmp/t/work" /tmp/t/m1 /tmp/t/m2
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint /tmp/t/m1 from.dmg </dev/null >/dev/null
          ditto /tmp/t/m1/*.app "/tmp/t/Apps/OpenCursor.app"; hdiutil detach -quiet /tmp/t/m1
          STAGED="/tmp/t/Apps/OpenCursor.app.new-update-1-$(date +%s)000"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint /tmp/t/m2 to.dmg </dev/null >/dev/null
          ditto /tmp/t/m2/*.app "$STAGED"; hdiutil detach -quiet /tmp/t/m2
          xattr -dr com.apple.quarantine "$STAGED" || true
          echo "STAGED=$STAGED" >> "$GITHUB_ENV"
          cp to.dmg /tmp/t/work/to.dmg
      - name: Run the app's swap script
        run: |
          node -e "const p=require('./plan.cjs');require('fs').writeFileSync('/tmp/t/work/install.sh',p.swapScript({platform:'darwin',staged:process.env.STAGED,target:'/tmp/t/Apps/OpenCursor.app',relaunchFlag:'/tmp/t/work/relaunch',log:'/tmp/t/update.log',download:'/tmp/t/work/to.dmg',work:'/tmp/t/work'}))"
          sh /tmp/t/work/install.sh; echo "exit $?"
          cat /tmp/t/update.log || true
      - name: Check the result
        run: |
          want="${{ inputs.to }}"; want="${want#v}"
          got=$(node -p "require('/tmp/t/Apps/OpenCursor.app/Contents/Resources/app/extensions/open-cursor/package.json').version")
          echo "installed version: $got"
          test "$got" = "$want"
          test ! -e "$STAGED" || { echo "staging left behind"; exit 1; }
          "/tmp/t/Apps/OpenCursor.app/Contents/Resources/app/bin/code" --version
          echo "all checks passed"
